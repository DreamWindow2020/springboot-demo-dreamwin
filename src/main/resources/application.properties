# Supabase Direct Connection URL (using parameters from your dashboard)
spring.datasource.url=jdbc:postgresql://db.cdbwldjqqwjezlizlptm.supabase.co:5432/postgres?user=postgres&password=YourShop@2026!&sslmode=require
spring.datasource.username=postgres
spring.datasource.password=YourShop@2026!
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is managed by Flyway migrations (db/migration/).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Render injects PORT; default to 8080 for local runs
server.port=${PORT:8080}

# Expose a health endpoint Render can poll
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
