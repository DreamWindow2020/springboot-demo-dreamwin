spring.application.name=demo-springboot-supabase

# Render injects these as env vars; fall back to local Supabase values for local dev
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db.cdbwldjqqwjezlizlptm.supabase.co:5432/postgres?user=postgres&password=YourShop@2026!&sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:YourShop@2026!}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is managed by Flyway migrations (db/migration/).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Render injects PORT; default to 8080 for local runs
server.port=${PORT:8080}

# Expose a health endpoint Render can poll
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
