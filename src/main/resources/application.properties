spring.application.name=demo-springboot-supabase

# Supabase Postgres connection (set these as env vars, see .env.example)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Demo only: auto-create/update the schema from the Item entity.
# Switch to 'validate' + a migration tool (Flyway/Liquibase) beyond demo use.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Render injects PORT; default to 8080 for local runs
server.port=${PORT:8080}

# Expose a health endpoint Render can poll
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
